<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard - Le Coussin</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .polaroid {
            background: white;
            padding: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 200px;
            transform: rotate(-3deg);
            /* border-radius: 10px; */
        }
        .image-container {
            width: 100%;
            height: 200px;
            background-color: grey;
            display: flex;
            justify-content: center;
            align-items: center;
            /* border-radius: 5px; */
        }
        .caption {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-button {
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="polaroid">
        <div class="image-container">
            <img src="assets/Untitled design (2).jpg" alt="Le coussin" style="max-width: 100%; max-height: 100%;">
        </div>
        <div class="caption">
            Le coussin
            <button class="play-button" onclick="document.getElementById('audio').play()">▶️</button>
        </div>
        <audio id="audio" controls style="display: none;">
            <source src="assets/pillow.mov" type="audio/mp4">
            Your browser does not support the audio element.
        </audio>
    </div>
</body>
</html>
