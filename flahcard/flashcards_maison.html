
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - La Maison</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .top-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .top-section video {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        .top-section p {
            font-size: 18px;
            line-height: 1.6;
            max-width: 800px;
            margin: 20px auto;
            text-align: left;
        }
        .flashcards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .polaroid {
            background: white;
            padding: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 200px;
            transform: rotate(-3deg);
        }
        .image-container {
            width: 100%;
            height: 200px;
            background-color: grey;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .caption {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-button {
            margin-left: 10px;
            cursor: pointer;
        }

        /* Hover Effect for Words */
        .translatable {
            position: relative;
            cursor: pointer;
        }
        .translatable:hover {
            background-color: yellow;
        }
        .translatable::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .translatable:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Top Section: Video and Paragraph -->
    <div class="top-section">
        <video controls autoplay muted loop>
            <source src="assets/notremaison.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <p>
            <span class="translatable" title="It was">C’était</span> <span class="translatable" title="a">une</span> <span class="translatable" title="quiet">tranquille</span> <span class="translatable" title="day">journée</span> <span class="translatable" title="at">à</span> <span class="translatable" title="home">la maison</span>. <span class="translatable" title="In">Dans</span> <span class="translatable" title="the">le</span> <span class="translatable" title="hallway">couloir</span>, <span class="translatable" title="the">l’</span> <span class="translatable" title="clock">horloge</span> <span class="translatable" title="was">était</span> <span class="translatable" title="showing">affichant</span> <span class="translatable" title="the time">l’heure</span>.
        </p>
    </div>

    <!-- Flashcards Section -->
    <div class="flashcards-container">
        <div class="polaroid">
            <div class="image-container">Image</div>
            <div class="caption">La Maison</div>
        </div>
        <div class="polaroid">
            <div class="image-container">Image</div>
            <div class="caption">Le Couloir</div>
        </div>
        <div class="polaroid">
            <div class="image-container">Image</div>
            <div class="caption">L'Horloge</div>
        </div>
    </div>
</body>
</html>
